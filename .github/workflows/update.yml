name: update-data-and-deploy
on:
  schedule:
    # Appleの公開は太平洋時間10:00が通例（RSSのpubDateで確認）。夏時間(17:00Z)/冬時間(18:00Z)の
    # どちらでも過ぎている 18:15 UTC (03:15 JST) に毎日1回。GDMFは1日1回までが目安
    - cron: "15 18 * * *"
  workflow_dispatch:
  push:            # デプロイ（main へのpush）時にも1回実行して最新化
    branches: [main]
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/fetch_releases.py
      - name: Commit data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/releases.json
          git diff --cached --quiet || (git commit -m "chore: update releases data" && git push)
      - uses: actions/configure-pages@v5
      - run: mkdir _site && cp -r index.html data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.d.outputs.page_url }}
    steps:
      - id: d
        uses: actions/deploy-pages@v4
